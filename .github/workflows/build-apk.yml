name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web folder
        run: |
          if [ -f index.html ]; then mkdir -p www && cp index.html www/index.html; fi
          ls -la www

      - name: Create Android project
        run: npx cap add android

      - name: Add full-screen support for Car Control
        run: cp MainActivity.java android/app/src/main/java/com/rit/control/MainActivity.java

      - name: Use the same signing key every build (updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create RIT Control app icons
        run: |
          pip install pillow
          python3 make_icons.py


      - name: Allow HTTP to NodeMCU + microphone permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $M
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n</manifest>|' $M
          grep -q 'android.permission.INTERNET' $M || sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>|' $M
          cat $M

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RIT-Control-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
